<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" type="application/atom+xml" title="readings" href="/readings.xml">
  <link rel="pgpkey" type="application/pgp-keys" href="/pgp.asc">
  <title>{% if page.url != "/" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg-color: #fafafa;
      --text-color: #111111;
      --link-color: #0000ee;
      --border-color: #cccccc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #121212;
        --text-color: #e0e0e0;
        --link-color: #8ab4f8;
        --border-color: #444444;
      }
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 750px;
      margin: 2rem auto;
      padding: 0 1rem;
      font-family: 'Times New Roman', serif;
      line-height: 1.4;
      overflow-wrap: break-word;
      hyphens: auto;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    a { color: var(--link-color); }
    a:focus-visible, summary:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
    a[aria-current="page"] { color: inherit; text-decoration: none; }
    hr { border: 0; border-top: 1px solid var(--border-color); }

    pre {
      font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      hyphens: none;
      background-color: transparent;
      padding: 0.5rem 0;
    }

    blockquote {
      border-left: 3px solid var(--border-color);
      margin: 1.5rem 0;
      padding: 0 1rem;
    }
    blockquote p { margin: 0; }
    blockquote small { font-style: italic; opacity: 0.75; }

    @media print {
      nav, nav + hr, footer, footer hr { display: none; }
      body { max-width: none; margin: 0; }
      a { color: inherit; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="/"{% if page.url == "/" %} aria-current="page"{% endif %}>home</a> | <a href="/bookshelf/"{% if page.url == "/bookshelf/" %} aria-current="page"{% endif %}>bookshelf</a> | <a href="/readings/"{% if page.url == "/readings/" %} aria-current="page"{% endif %}>readings</a>
  </nav>
  <hr>
  <main>
    {{ content }}
  </main>

  {% include footer.html %}
</body>
</html>
